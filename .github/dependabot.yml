version: 2

# Dependabot proposes upgrades; OSV-Scanner (.github/workflows/osv-scanner.yml)
# says when we are exposed. Neither is much use without the other.
#
# Weekly, grouped and capped, on purpose: a stream of ungrouped dependency PRs gets
# merged without being read, which is the habit a supply-chain attack relies on.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    # Indirect dependencies too. Dependabot's gomod default is `direct` only, and
    # on the day this file was added every OSV finding on main was indirect —
    # including google.golang.org/grpc at CVSS 8.8. Repository security updates
    # were already enabled and had raised no alert and opened no PR for any of
    # them, so they are not a substitute for this.
    allow:
      - dependency-type: all
    # Kubernetes, controller-runtime and Cluster API move as one set: a Cluster API
    # minor release pins the Kubernetes and controller-runtime minors it is built
    # against, and it is this provider's contract version. Minor and major updates
    # of that set are therefore NOT proposed — moving to a new Cluster API line is a
    # deliberate change, made against the versions that release pins.
    #
    # The first version of this file grouped them as a separate minor group, as a
    # prompt. It did not work, for two reasons measured on the first run:
    #
    #  - Dependabot bumps each module to its own latest rather than to a set that
    #    fits: it proposed controller-runtime 0.25 and Kubernetes 0.37 under
    #    Cluster API v1.13, when no Cluster API release yet supports either (the
    #    newest, v1.14, pins controller-runtime 0.24 and Kubernetes 0.36).
    #  - A Kubernetes minor bump also moves the shared sigs.k8s.io libraries, so the
    #    minor PR always contained everything the patch PR did, and Dependabot
    #    closed the patch PR as superseded — stranding routine patches, including a
    #    Cluster API patch release, behind a PR that should never be merged.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sigs.k8s.io/cluster-api*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # Patch releases of the set are routine and taken together.
      kubernetes-patch:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [patch]
      # The catch-all EXCLUDES the patterns above rather than relying on group
      # order. A group with no `patterns` matches everything, and which group
      # claims a dependency first is not something we can verify from here — the
      # KubeSwift repo had a kubernetes group that never produced a single PR
      # because its catch-all kept winning.
      go-minor-patch:
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      # The two OSV-Scanner reusable workflows are one tool at one commit, but
      # they are different action paths and Dependabot treats sub-paths as
      # separate dependencies. Ungrouped they arrive as separate PRs that leave
      # the pair at different versions.
      osv-scanner:
        patterns: ["google/osv-scanner-action*"]
        update-types: [major, minor, patch]

  # The manager image's builder and runtime base.
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
