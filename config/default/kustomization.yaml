# Adds namespace to all resources.
#
# capks- is the provider's acronym, matching how every upstream Cluster API
# provider names itself: core is capi-system/capi-controller-manager, AWS is
# capa-, Azure capz-. The previous cluster-api-provider-kubeswift- prefix made
# the namespace 38 characters and every object name longer still, for no benefit
# — the repository name belongs in the app.kubernetes.io/name label, which still
# carries it, not in every resource name an operator has to type.
#
# The two values are coupled: the Namespace object in config/manager/manager.yaml
# is literally named "system", so the namespace that everything lands in is
# namePrefix + "system". Change one without the other and the manifests install
# into a namespace nothing creates.
namespace: capks-system

# Value of this field is prepended to the names of all resources.
namePrefix: capks-

# The clusterctl provider label. clusterctl uses it to identify and manage every
# object belonging to this provider (install, upgrade, delete, and move/pivot).
# includeSelectors:false so it is added to resource metadata only and never mutates
# the immutable Deployment/Service selectors.
labels:
- includeSelectors: false
  pairs:
    cluster.x-k8s.io/provider: infrastructure-kubeswift-io

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] The validating webhook (KubeSwiftMachineTemplate immutability).
- ../webhook
# [CERTMANAGER] cert-manager issues the webhook serving cert (secret webhook-server-cert).
- ../certmanager
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml

patches:
# [METRICS] Enable the metrics endpoint (HTTPS on :8443).
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
# [WEBHOOK] Mount the webhook serving cert + open the webhook port on the manager.
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment

# [CERTMANAGER] CA injection for the webhook:
#   - substitute the webhook Service name/namespace into the serving-cert dnsNames
#   - inject the serving-cert CA into the ValidatingWebhookConfiguration's caBundle
replacements:
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 0
          create: true
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
