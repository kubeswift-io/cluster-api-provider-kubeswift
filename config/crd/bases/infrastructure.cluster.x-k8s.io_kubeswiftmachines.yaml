---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kubeswiftmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: KubeSwiftMachine
    listKind: KubeSwiftMachineList
    plural: kubeswiftmachines
    singular: kubeswiftmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: VM is provisioned and running
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Machine backend
      jsonPath: .spec.backend.type
      name: Backend
      type: string
    - description: Provider ID
      jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubeSwiftMachine is the Schema for the kubeswiftmachines API. It is the
          infrastructure counterpart of a Cluster API Machine, backed by a KubeSwift VM.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubeSwiftMachineSpec defines the desired state of KubeSwiftMachine.
            properties:
              backend:
                description: |-
                  backend selects and configures the KubeSwift resource that backs this machine.
                  The config matching backend.type must be set. Today only "SwiftGuest" is a
                  valid node backend; the discriminator exists so a future feasible substrate
                  can be added without an API break.
                properties:
                  swiftGuest:
                    description: |-
                      swiftGuest configures the SwiftGuest (full VM) backend. Required when
                      type is "SwiftGuest".
                    properties:
                      gpu:
                        description: |-
                          gpu optionally gives this machine a whole passthrough GPU, making it a
                          GPU-capable Kubernetes worker.

                          KubeSwift owns the physical device: it binds it to vfio-pci and passes it
                          into the VM. What runs INSIDE the guest — a device plugin, a fractional GPU
                          sharer such as HAMi, a plain CUDA workload — is the workload cluster's
                          business and nothing to do with this provider.

                          A GPU machine is a disk boot (KubeSwift makes GPU passthrough mutually
                          exclusive with kernel boot), and only the pcie tier is supported: the HGX
                          tiers need QEMU plus a host Fabric Manager, and KubeSwift rejects hgx-full at
                          allocation.
                        properties:
                          gpuProfileRef:
                            description: |-
                              gpuProfileRef selects KubeSwift's NATIVE allocation backend: a
                              SwiftGPUProfile in the guest namespace, with the SwiftGPU controller picking
                              node and devices before the pod exists.

                              Mutually exclusive with the two claim references.
                            type: string
                          hugepages:
                            description: hugepages sizes the GPU memory hugepage backing
                              ("1Gi", "2Mi", or empty).
                            enum:
                            - ""
                            - 1Gi
                            - 2Mi
                            type: string
                          requestName:
                            description: |-
                              requestName is the device-request name inside the claim to read the
                              allocation result back from. Defaults to KubeSwift's own default ("gpu").
                            type: string
                          resourceClaimName:
                            description: |-
                              resourceClaimName selects the DRA backend using a pre-created, SHARED
                              ResourceClaim. A VFIO device can back only one running VM, so this is only
                              correct when exactly one machine references the claim.

                              Mutually exclusive with resourceClaimTemplateName and gpuProfileRef.
                            type: string
                          resourceClaimTemplateName:
                            description: |-
                              resourceClaimTemplateName selects the DRA backend: the launcher pod carries a
                              ResourceClaim minted from this template, and the kube-scheduler plus a DRA
                              driver allocate the device at pod-schedule time. Recommended.

                              Mutually exclusive with resourceClaimName and gpuProfileRef.
                            type: string
                          tier:
                            default: pcie
                            description: |-
                              tier selects hypervisor and firmware. Only pcie (Cloud Hypervisor) is
                              supported here.
                            enum:
                            - pcie
                            type: string
                        type: object
                      guestClassRef:
                        description: |-
                          guestClassRef names the cluster-scoped SwiftGuestClass that supplies the VM's
                          CPU, memory, and root-disk sizing (SwiftGuest carries no inline sizing).
                        type: string
                      imageRef:
                        description: |-
                          imageRef names the SwiftImage the VM boots from (disk boot). It references a
                          SwiftImage by name in the guest namespace, which must be Ready before boot.
                        type: string
                      networkRef:
                        description: |-
                          networkRef optionally attaches the VM's primary interface to a named network
                          (a NetworkAttachmentDefinition). Empty uses the default node-local network.
                        type: string
                      nodeName:
                        description: |-
                          nodeName pins this machine's VM to a named Kubernetes node in the
                          infrastructure cluster, for the cases where placement is not the scheduler's
                          to choose: a host with the hardware, a licence bound to a machine, storage
                          that only one node can serve, or a node-local network the VM must share with
                          something else.

                          KubeSwift implements it by writing pod.spec.nodeName on the launcher pod, so
                          the scheduler is bypassed entirely and a bad fit is rejected by the kubelet in
                          seconds instead of sitting Pending.

                          That is also why it cannot be combined with gpu: a DRA claim is allocated BY
                          the scheduler, so bypassing it would leave the claim unallocated and the VM
                          with no device, and a native gpuProfileRef is placed by KubeSwift's own
                          allocation, which this would have to agree with by luck. A GPU machine is
                          already pinned — by where its device is.
                        maxLength: 253
                        minLength: 1
                        type: string
                      nodeNetworkRef:
                        description: |-
                          nodeNetworkRef optionally attaches a SECONDARY interface to a named routable
                          network (a NetworkAttachmentDefinition — e.g. an OVN-Kubernetes secondary UDN)
                          that carries the workload node datapath: apiserver<->kubelet and the pod overlay,
                          with unique cross-node-routable IPs. The primary interface stays node-local (nat),
                          so the control-plane endpoint remains reachable from the management cluster (no
                          proxy). Each node's kubelet --node-ip must be set to this interface's address (a
                          bootstrap step). Use this for multi-node clusters when the primary pod network is
                          not itself node-routable. Composes with a Service-backed control-plane endpoint;
                          unlike networkRef (which makes the named network the guest's *primary*), it does
                          not isolate the apiserver from the management controllers.
                        type: string
                      storageClassName:
                        description: |-
                          storageClassName optionally overrides the StorageClass for the VM's root
                          disk. Empty inherits the source SwiftImage's class (KubeSwift's default).
                          Set this when the image's class does not fit the target cluster -- e.g. to
                          pin a 1-replica class on storage that cannot hold the image class's replica
                          count, or to place node disks on a specific backend. Applies to the
                          controller-created root-disk PVC only.
                        type: string
                    type: object
                  type:
                    default: SwiftGuest
                    description: type is the backend kind. Only "SwiftGuest" is currently
                      supported.
                    enum:
                    - SwiftGuest
                    type: string
                required:
                - type
                type: object
              providerID:
                description: |-
                  providerID must match the provider ID on the Node backing this machine, in
                  the form "kubeswift://<guest-namespace>/<guest-name>". The controller sets it
                  once the backing resource is provisioned; the Cluster API Machine controller
                  surfaces it on the Machine. Cluster API infrastructure-provider contract field.
                maxLength: 512
                minLength: 1
                type: string
            required:
            - backend
            type: object
          status:
            description: KubeSwiftMachineStatus defines the observed state of KubeSwiftMachine.
            properties:
              addresses:
                description: addresses lists the addresses assigned to the VM, surfaced
                  to the Machine.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represents the observations of the KubeSwiftMachine's state.
                  A condition of type "Ready" is mirrored into the Machine's InfrastructureReady
                  condition. Per the v1beta2 contract, terminal failures are surfaced via
                  conditions (there is no failureReason/failureMessage).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: |-
                  failureDomain is the failure domain the VM was actually placed in, surfaced
                  to the Machine.
                maxLength: 256
                minLength: 1
                type: string
              initialization:
                description: |-
                  initialization reports the KubeSwiftMachine initialization state.
                  Part of the Cluster API infrastructure-provider contract (v1beta2).
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure provider reports that the
                      resource's infrastructure is fully provisioned.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
