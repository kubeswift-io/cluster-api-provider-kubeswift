---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kubeswiftmachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: KubeSwiftMachineTemplate
    listKind: KubeSwiftMachineTemplateList
    plural: kubeswiftmachinetemplates
    singular: kubeswiftmachinetemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KubeSwiftMachineTemplate is the Schema for the kubeswiftmachinetemplates
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubeSwiftMachineTemplateSpec defines the desired state of
              KubeSwiftMachineTemplate.
            properties:
              template:
                description: |-
                  template is the KubeSwiftMachine that MachineDeployments and ClusterClass
                  stamp out.
                properties:
                  metadata:
                    description: metadata is the labels and annotations to stamp onto
                      the created object.
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: spec is the KubeSwiftMachineSpec to stamp out.
                    properties:
                      backend:
                        description: |-
                          backend selects and configures the KubeSwift resource that backs this machine.
                          The config matching backend.type must be set. Today only "SwiftGuest" is a
                          valid node backend; the discriminator exists so a future feasible substrate
                          can be added without an API break.
                        properties:
                          swiftGuest:
                            description: |-
                              swiftGuest configures the SwiftGuest (full VM) backend. Required when
                              type is "SwiftGuest".
                            properties:
                              gpu:
                                description: |-
                                  gpu optionally gives this machine a whole passthrough GPU, making it a
                                  GPU-capable Kubernetes worker.

                                  KubeSwift owns the physical device: it binds it to vfio-pci and passes it
                                  into the VM. What runs INSIDE the guest — a device plugin, a fractional GPU
                                  sharer such as HAMi, a plain CUDA workload — is the workload cluster's
                                  business and nothing to do with this provider.

                                  A GPU machine is a disk boot (KubeSwift makes GPU passthrough mutually
                                  exclusive with kernel boot), and only the pcie tier is supported: the HGX
                                  tiers need QEMU plus a host Fabric Manager, and KubeSwift rejects hgx-full at
                                  allocation.
                                properties:
                                  gpuProfileRef:
                                    description: |-
                                      gpuProfileRef selects KubeSwift's NATIVE allocation backend: a
                                      SwiftGPUProfile in the guest namespace, with the SwiftGPU controller picking
                                      node and devices before the pod exists.

                                      Mutually exclusive with the two claim references.
                                    type: string
                                  hugepages:
                                    description: hugepages sizes the GPU memory hugepage
                                      backing ("1Gi", "2Mi", or empty).
                                    enum:
                                    - ""
                                    - 1Gi
                                    - 2Mi
                                    type: string
                                  requestName:
                                    description: |-
                                      requestName is the device-request name inside the claim to read the
                                      allocation result back from. Defaults to KubeSwift's own default ("gpu").
                                    type: string
                                  resourceClaimName:
                                    description: |-
                                      resourceClaimName selects the DRA backend using a pre-created, SHARED
                                      ResourceClaim. A VFIO device can back only one running VM, so this is only
                                      correct when exactly one machine references the claim.

                                      Mutually exclusive with resourceClaimTemplateName and gpuProfileRef.
                                    type: string
                                  resourceClaimTemplateName:
                                    description: |-
                                      resourceClaimTemplateName selects the DRA backend: the launcher pod carries a
                                      ResourceClaim minted from this template, and the kube-scheduler plus a DRA
                                      driver allocate the device at pod-schedule time. Recommended.

                                      Mutually exclusive with resourceClaimName and gpuProfileRef.
                                    type: string
                                  tier:
                                    default: pcie
                                    description: |-
                                      tier selects hypervisor and firmware. Only pcie (Cloud Hypervisor) is
                                      supported here.
                                    enum:
                                    - pcie
                                    type: string
                                type: object
                              guestClassRef:
                                description: |-
                                  guestClassRef names the cluster-scoped SwiftGuestClass that supplies the VM's
                                  CPU, memory, and root-disk sizing (SwiftGuest carries no inline sizing).
                                type: string
                              imageRef:
                                description: |-
                                  imageRef names the SwiftImage the VM boots from (disk boot). It references a
                                  SwiftImage by name in the guest namespace, which must be Ready before boot.
                                type: string
                              networkRef:
                                description: |-
                                  networkRef optionally attaches the VM's primary interface to a named network
                                  (a NetworkAttachmentDefinition). Empty uses the default node-local network.
                                type: string
                              nodeName:
                                description: |-
                                  nodeName pins this machine's VM to a named Kubernetes node in the
                                  infrastructure cluster, for the cases where placement is not the scheduler's
                                  to choose: a host with the hardware, a licence bound to a machine, storage
                                  that only one node can serve, or a node-local network the VM must share with
                                  something else.

                                  KubeSwift implements it by writing pod.spec.nodeName on the launcher pod, so
                                  the scheduler is bypassed entirely and a bad fit is rejected by the kubelet in
                                  seconds instead of sitting Pending.

                                  That is also why it cannot be combined with gpu: a DRA claim is allocated BY
                                  the scheduler, so bypassing it would leave the claim unallocated and the VM
                                  with no device, and a native gpuProfileRef is placed by KubeSwift's own
                                  allocation, which this would have to agree with by luck. A GPU machine is
                                  already pinned — by where its device is.
                                maxLength: 253
                                minLength: 1
                                type: string
                              nodeNetworkRef:
                                description: |-
                                  nodeNetworkRef optionally attaches a SECONDARY interface to a named routable
                                  network (a NetworkAttachmentDefinition — e.g. an OVN-Kubernetes secondary UDN)
                                  that carries the workload node datapath: apiserver<->kubelet and the pod overlay,
                                  with unique cross-node-routable IPs. The primary interface stays node-local (nat),
                                  so the control-plane endpoint remains reachable from the management cluster (no
                                  proxy). Each node's kubelet --node-ip must be set to this interface's address (a
                                  bootstrap step). Use this for multi-node clusters when the primary pod network is
                                  not itself node-routable. Composes with a Service-backed control-plane endpoint;
                                  unlike networkRef (which makes the named network the guest's *primary*), it does
                                  not isolate the apiserver from the management controllers.
                                type: string
                              storageClassName:
                                description: |-
                                  storageClassName optionally overrides the StorageClass for the VM's root
                                  disk. Empty inherits the source SwiftImage's class (KubeSwift's default).
                                  Set this when the image's class does not fit the target cluster -- e.g. to
                                  pin a 1-replica class on storage that cannot hold the image class's replica
                                  count, or to place node disks on a specific backend. Applies to the
                                  controller-created root-disk PVC only.
                                type: string
                            type: object
                          type:
                            default: SwiftGuest
                            description: type is the backend kind. Only "SwiftGuest"
                              is currently supported.
                            enum:
                            - SwiftGuest
                            type: string
                        required:
                        - type
                        type: object
                      providerID:
                        description: |-
                          providerID must match the provider ID on the Node backing this machine, in
                          the form "kubeswift://<guest-namespace>/<guest-name>". The controller sets it
                          once the backing resource is provisioned; the Cluster API Machine controller
                          surfaces it on the Machine. Cluster API infrastructure-provider contract field.
                        maxLength: 512
                        minLength: 1
                        type: string
                    required:
                    - backend
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
